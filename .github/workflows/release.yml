name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-and-tizen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Android keystore not configured, will use debug signing"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "master" ] && VERSION="0.5.0-tizen"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "FrankKaraoke-${VERSION}-android.apk"
          cp tizen-tv/FrankKaraoke.wgt "FrankKaraoke-${VERSION}-tizen.wgt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frank-karaoke-tizen-bundle
          path: |
            FrankKaraoke-*-android.apk
            FrankKaraoke-*-tizen.wgt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Frank Karaoke + Samsung Tizen TV ${{ github.ref_name }}"
          body: |
            ## Frank Karaoke + Samsung Tizen TV Edition

            ### 1. Celular Android (Controle + Microfone)
            1. Baixe `FrankKaraoke-*-android.apk` e instale no seu celular Android.
            2. Conceda a permissão de microfone ao abrir.

            ### 2. TV Samsung (Tizen OS)
            1. Instale `FrankKaraoke-*-tizen.wgt` na sua TV Samsung em Modo Desenvolvedor.
            2. Com o celular e a TV no mesmo Wi-Fi, o pareamento acontece automaticamente!
            3. Escolha qualquer música de karaokê no YouTube pelo celular: o vídeo, a letra e a pontuação em tempo real aparecerão na TV enquanto você canta pelo microfone do celular.
          draft: false
          prerelease: false
          files: |
            FrankKaraoke-*-android.apk
            FrankKaraoke-*-tizen.wgt
